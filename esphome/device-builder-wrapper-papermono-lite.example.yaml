# ESPHome Device Builder local wrapper for Basement Remote on M5PaperMono Lite.
#
# Create the device using Empty Configuration, then replace the generated YAML
# with this file. Firmware and hardware support are loaded from GitHub; only
# credentials remain local to Home Assistant.
#
# Do not put actual credentials in this checked-in example.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  fallback_ap_password: !secret fallback_ap_password
  basement_remote_api_encryption_key: !secret basement_remote_api_encryption_key

packages:
  basement_remote:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: main
    files:
      - esphome/basement-remote-papermono-lite.yaml
    refresh: 60s
