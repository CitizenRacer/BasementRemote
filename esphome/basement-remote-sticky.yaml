# Basement Remote Sticky firmware
#
# v1.0.18 preserves the hardware-validated v1.0.14 board power-latch sequence,
# keeps the shared Home Assistant/Alexa TV-on recovery path, and fixes the GT911
# wake failure without cold-power-cycling the touchscreen on every deep-sleep
# transition.
#
# This file is the production package consumed by Device Builder.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.18"

packages:
  sticky_v1014_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: dc4113e58f1b3d96a08825d5e63aadbaac05603b
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

# The v1.0.14 base owns GPIO45/GPIO46/GPIO47 and the board power latch. Do not
# manipulate those pins here.
#
# v1.0.14 powered the GT911 rail off before deep sleep. Repeated hardware tests
# showed that a cold GT911 start can leave ESPHome's touchscreen component
# failed after wake. Keep GPIO42 powered and held HIGH through deep sleep instead.
# The normal GT911 reset-pin sequence still runs on every boot.
esphome:
  on_shutdown:
    - priority: 700
      then:
        - lambda: |-
            // The base shutdown has already disabled/held GPIO42 LOW. Override
            // only that touch rail after the base shutdown action; leave the
            // board power latch and e-paper rail completely untouched.
            gpio_hold_dis(GPIO_NUM_42);
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 1);
            gpio_hold_en(GPIO_NUM_42);
            gpio_deep_sleep_hold_en();
            ESP_LOGI("touch", "GT911 power retained through deep sleep");

  on_boot:
    - priority: -110
      then:
        - logger.log: "Basement Remote v1.0.18 touch recovery initialization complete"

# Do not scan the GT911 bus during startup. The controller is known and has a
# dedicated bus; eliminating the scan removes an unnecessary transaction before
# touchscreen initialization.
i2c:
  - id: !extend touch_i2c
    scan: false

# Initialize the GT911 only after the v1.0.14 priority-600 action has restored
# the touch switch. The Sticky's controller uses 0x14. Supplying its known raw
# dimensions also avoids the driver's separate startup calibration-register read,
# another point where the current ESPHome GT911 driver can mark itself failed.
touchscreen:
  - id: !extend sticky_touch
    setup_priority: 500
    address: 0x14
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 800

# Home Assistant can authenticate the ESPHome API before it has subscribed to
# device actions. Wait for a state-subscribing Home Assistant client plus a
# short grace period before invoking the shared TV-on script.
api:
  id: remote_api
  on_client_connected:
    - delay: 2s
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - logger.log: "Home Assistant API subscription is ready for remote actions"

# Keep the v1.0.14 GPIO4 wake source and power-latch sequencing unchanged. This
# secondary recovery path handles slow Wi-Fi/API reconnects after a physical wake.
deep_sleep:
  on_wake:
    - script.execute: wake_tv_after_reconnect

script:
  - id: wake_tv_after_reconnect
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "Deep-sleep recovery: waiting for Home Assistant subscription"
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 60s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - delay: 2s
            - logger.log: "Deep-sleep recovery: calling shared Home Assistant TV-on script"
            - homeassistant.action:
                action: script.tv_turn_on_the_tv_cable
            - repeat:
                count: 8
                then:
                  - delay: 5s
                  - lambda: 'id(tv_wake_in_progress) = true;'
            - lambda: 'id(tv_wake_in_progress) = false;'
            - script.execute: enter_tv_off_sleep
          else:
            - logger.log:
                level: ERROR
                format: "Deep-sleep recovery: Home Assistant did not become ready within 60 seconds"
            - lambda: 'id(tv_wake_in_progress) = false;'
