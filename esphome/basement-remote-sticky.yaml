# Basement Remote Sticky firmware
#
# v1.0.32 supersedes the non-deployable v1.0.31 readiness attempt. It retains
# all v1.0.30 production behavior and makes the ready line wait for proof that
# the startup SSD1677 refresh actually began and subsequently reached IDLE.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.32"

packages:
  # Start from the last validated production behavior. v1.0.31 is deliberately
  # skipped because its package merge produced a duplicate script ID in CI.
  sticky_v1030_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: 557254ecfd6a9efe06d341ecbc8334fa83a48cb9
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

  # The v1.0.30 package chain installs an API callback that invokes the older
  # report_ready_after_init script. Remove only that callback; leaving the old
  # script defined but unreachable avoids fragile script-list replacement.
  remove_inherited_ready_callback:
    api:
      on_client_connected: !remove

# The inherited startup sequence requests the initial e-paper refresh at
# priority 600. Start the hardware-progress monitor immediately afterward.
esphome:
  on_boot:
    - priority: 550
      then:
        - script.execute: monitor_startup_epaper_refresh_v1032

# Per-boot evidence that the display update actually entered hardware work and
# then completed. GPIO18 is already configured as the SSD1677 BUSY input by the
# Seeed reTerminal Sticky display preset, so read it directly rather than trying
# to register a second ESPHome GPIO component on the same pin.
globals:
  - id: startup_epaper_busy_seen_v1032
    type: bool
    restore_value: false
    initial_value: "false"

  - id: startup_epaper_complete_v1032
    type: bool
    restore_value: false
    initial_value: "false"

# Replace the inherited API connection callback with the v1.0.32 readiness gate.
api:
  on_client_connected:
    - script.execute: report_ready_after_init_v1032

script:
  # Component::is_idle() by itself is not sufficient because it can already be
  # true before component.update has begun executing. First require GPIO18 BUSY
  # to assert, proving the startup refresh reached the SSD1677. Only after that
  # hardware event do we accept the e-paper component returning to IDLE as the
  # completion signal for the full update/power-off/deep-sleep state machine.
  - id: monitor_startup_epaper_refresh_v1032
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return gpio_get_level(GPIO_NUM_18) != 0;'
          timeout: 15s
      - if:
          condition:
            lambda: 'return gpio_get_level(GPIO_NUM_18) != 0;'
          then:
            - lambda: 'id(startup_epaper_busy_seen_v1032) = true;'
            - logger.log:
                level: DEBUG
                format: "Startup e-paper BUSY observed; waiting for display state machine to finish"
            - wait_until:
                condition:
                  lambda: |-
                    return id(startup_epaper_busy_seen_v1032) &&
                           !id(epaper_display).is_failed() &&
                           id(epaper_display).is_idle();
                timeout: 30s
            - if:
                condition:
                  lambda: |-
                    return id(startup_epaper_busy_seen_v1032) &&
                           !id(epaper_display).is_failed() &&
                           id(epaper_display).is_idle();
                then:
                  - lambda: 'id(startup_epaper_complete_v1032) = true;'
                  - logger.log:
                      level: DEBUG
                      format: "Startup e-paper refresh state machine complete"
                else:
                  - logger.log:
                      level: ERROR
                      format: "Startup e-paper refresh did not return to idle"
          else:
            - logger.log:
                level: ERROR
                format: "Startup e-paper BUSY was never observed; not reporting ready"

  - id: report_ready_after_init_v1032
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(ready_logged);'
          then:
            - wait_until:
                condition:
                  and:
                    - api.connected:
                        state_subscription_only: true
                    - lambda: |-
                        const bool tv_state_ready =
                            id(basement_tv_state).has_state() &&
                            id(basement_tv_state).state != "unknown" &&
                            id(basement_tv_state).state != "unavailable";
                        const bool touch_ready =
                            !id(sticky_touch).is_failed() &&
                            (id(sticky_touch).is_in_loop_state() || id(sticky_touch).is_idle());
                        const bool display_ready =
                            id(startup_epaper_complete_v1032) &&
                            !id(epaper_display).is_failed() &&
                            id(epaper_display).is_idle();
                        return tv_state_ready && touch_ready && display_ready;
                timeout: 45s
            - if:
                condition:
                  and:
                    - api.connected:
                        state_subscription_only: true
                    - lambda: |-
                        const bool tv_state_ready =
                            id(basement_tv_state).has_state() &&
                            id(basement_tv_state).state != "unknown" &&
                            id(basement_tv_state).state != "unavailable";
                        const bool touch_ready =
                            !id(sticky_touch).is_failed() &&
                            (id(sticky_touch).is_in_loop_state() || id(sticky_touch).is_idle());
                        const bool display_ready =
                            id(startup_epaper_complete_v1032) &&
                            !id(epaper_display).is_failed() &&
                            id(epaper_display).is_idle();
                        return tv_state_ready && touch_ready && display_ready;
                then:
                  - logger.log: "Basement Remote firmware ${firmware_version} ready"
                  - lambda: 'id(ready_logged) = true;'
                else:
                  - logger.log:
                      level: ERROR
                      format: "Basement Remote initialization incomplete after 45 seconds; not reporting ready"
