# Basement Remote Sticky firmware
#
# v1.0.37 restores touchscreen reliability by backing out automatic ESP32-S3
# light sleep, which was introduced in v1.0.35 and made GT911 touch wake
# unreliable. The firmware returns to the validated v1.0.34 behavior as its
# base, then re-enables dynamic frequency scaling only: 40-160 MHz while awake,
# with automatic light sleep disabled. TV-off deep sleep and the approved sleep
# screen therefore use the same known-good path that predates the regression.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.37"

packages:
  sticky_v1034_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: 1d42b02d0da8c71eadae9aac80f0584d687bc516
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

# Keep the CPU-frequency power saving from the v1.0.35 experiment, but do not
# allow automatic light sleep. The GT911 remains continuously serviced while
# the TV is on, so touchscreen input no longer depends on GPIO21 successfully
# waking the ESP32-S3 from automatic light sleep.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_PM_ENABLE: "y"

esphome:
  includes:
    - <esp_pm.h>
  on_boot:
    - priority: -200
      then:
        # Preserve the known-good startup/readiness path before changing CPU PM.
        - delay: 20s
        - lambda: |-
            esp_pm_config_t pm_config{};
            pm_config.max_freq_mhz = 160;
            pm_config.min_freq_mhz = 40;
            pm_config.light_sleep_enable = false;

            const esp_err_t err = esp_pm_configure(&pm_config);
            if (err != ESP_OK) {
              ESP_LOGE("power",
                       "Dynamic frequency scaling could not be enabled: %s",
                       esp_err_to_name(err));
              return;
            }

            esp_pm_config_t active_config{};
            if (esp_pm_get_configuration(&active_config) == ESP_OK) {
              ESP_LOGI("power",
                       "Dynamic frequency scaling enabled; CPU range %d-%d MHz; automatic light sleep disabled",
                       active_config.min_freq_mhz, active_config.max_freq_mhz);
            } else {
              ESP_LOGI("power",
                       "Dynamic frequency scaling enabled; CPU range 40-160 MHz; automatic light sleep disabled");
            }
