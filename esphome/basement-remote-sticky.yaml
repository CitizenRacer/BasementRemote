# Basement Remote Sticky firmware
#
# v1.0.20 corrects the GT911 address after hardware logs showed that v1.0.19
# was trying to communicate at 0x14 and failing. Seeed's reTerminal Sticky
# ESPHome generator documents the touch controller at 0x5D, which is also the
# GT911 primary/default address in ESPHome. Keep the current wake, sleep, and
# Home Assistant availability behavior otherwise unchanged.
#
# This file is the production package consumed by Device Builder.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.20"

packages:
  sticky_v1014_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: dc4113e58f1b3d96a08825d5e63aadbaac05603b
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

# The v1.0.14 base owns GPIO45/GPIO46/GPIO47 and the board power latch. Do not
# manipulate those pins here.
#
# Keep GPIO42 powered and held HIGH through deep sleep so the GT911 is not
# cold-power-cycled on every sleep/wake transition. The normal GT911 reset-pin
# sequence still runs on every boot.
esphome:
  on_shutdown:
    - priority: 700
      then:
        - lambda: |-
            // The base shutdown has already disabled/held GPIO42 LOW. Override
            // only that touch rail after the base shutdown action; leave the
            // board power latch and e-paper rail completely untouched.
            gpio_hold_dis(GPIO_NUM_42);
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 1);
            gpio_hold_en(GPIO_NUM_42);
            gpio_deep_sleep_hold_en();
            ESP_LOGI("touch", "GT911 power retained through deep sleep");

  on_boot:
    - priority: -110
      then:
        - logger.log: "Basement Remote v1.0.20 initialization complete"

# The GT911 has a dedicated I2C bus. Avoid the extra startup scan.
i2c:
  - id: !extend touch_i2c
    scan: false

# Initialize only after the v1.0.14 priority-600 touch-power restoration.
# v1.0.18/v1.0.19 incorrectly forced 0x14; hardware logs showed an immediate
# communication failure there. Use the documented Sticky address 0x5D and let
# the GT911 driver read the controller's own calibration/configuration normally.
touchscreen:
  - id: !extend sticky_touch
    setup_priority: 500
    address: 0x5D

# Home Assistant can authenticate the ESPHome API before it has subscribed to
# device actions. Wait for a state-subscribing Home Assistant client plus a
# short grace period before invoking the shared TV-on script.
api:
  id: remote_api
  on_client_connected:
    - delay: 2s
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - logger.log: "Home Assistant API subscription is ready for remote actions"

# Keep the v1.0.14 GPIO4 wake source and power-latch sequencing unchanged. This
# secondary recovery path handles slow Wi-Fi/API reconnects after a physical wake.
deep_sleep:
  on_wake:
    - script.execute: wake_tv_after_reconnect

script:
  # Replace the v1.0.14 sleep-entry script so Wi-Fi is disabled immediately
  # before deep sleep. This makes Home Assistant mark the remote's entities
  # unavailable while it is asleep.
  - id: !remove render_sleep_and_enter

  - id: render_sleep_and_enter
    mode: restart
    then:
      - logger.log: "Rendering approved sleep face"
      - lambda: 'id(sleep_display_active) = true;'
      - component.update: epaper_display
      - delay: 10s
      - logger.log: "Sleep face rendered; dropping Wi-Fi so HA marks entities unavailable"
      - wifi.disable:
      - delay: 1s
      - deep_sleep.enter: tv_power_sleep

  - id: wake_tv_after_reconnect
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "Deep-sleep recovery: waiting for Home Assistant subscription"
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 60s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - delay: 2s
            - logger.log: "Deep-sleep recovery: calling shared Home Assistant TV-on script"
            - homeassistant.action:
                action: script.tv_turn_on_the_tv_cable
            - repeat:
                count: 8
                then:
                  - delay: 5s
                  - lambda: 'id(tv_wake_in_progress) = true;'
            - lambda: 'id(tv_wake_in_progress) = false;'
            - script.execute: enter_tv_off_sleep
          else:
            - logger.log:
                level: ERROR
                format: "Deep-sleep recovery: Home Assistant did not become ready within 60 seconds"
            - lambda: 'id(tv_wake_in_progress) = false;'
