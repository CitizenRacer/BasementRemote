# Basement Remote Sticky firmware
#
# v1.0.16 layers the shared Home Assistant/Alexa TV-on path over the v1.0.15
# wake/touch recovery fixes, which themselves are layered over the last
# hardware-validated v1.0.14 implementation. Pinning the base commit keeps the
# complete production UI and control surface unchanged while making the
# recovery delta explicit.
#
# This file is still the production package consumed by Device Builder.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.16"

packages:
  sticky_v1014_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: dc4113e58f1b3d96a08825d5e63aadbaac05603b
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

# The Sticky can wake through a board-level power/latch path as well as the ESP32
# deep-sleep wake path. Release the retained GPIO levels before the GPIO42 switch
# component initializes, then force a real GT911 power cycle. The blocking delays
# are deliberately short and occur during boot, before I2C/touch setup, so the
# controller has stable power when ESPHome runs the GT911 reset/address sequence.
esphome:
  on_boot:
    - priority: 1150
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_42);
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_hold_dis(GPIO_NUM_47);

            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 0);
            delay(25);
            gpio_set_level(GPIO_NUM_42, 1);
            delay(150);
            ESP_LOGI("touch", "GT911 power rail cold-cycled before touchscreen setup");

    - priority: -110
      then:
        - logger.log: "Basement Remote v1.0.16 recovery initialization complete"

# Home Assistant can authenticate the ESPHome API before it has subscribed to
# device actions. ESPHome explicitly warns that actions sent in that gap are
# dropped. Keep a diagnostic log point when a state-subscribing client (normally
# Home Assistant) has had time to finish registering its action subscription.
api:
  id: remote_api
  on_client_connected:
    - delay: 2s
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - logger.log: "Home Assistant API subscription is ready for remote actions"

# Keep the existing v1.0.14 fast wake path, but add a second idempotent recovery
# path that survives slow Wi-Fi/API reconnects. The authoritative recovery action
# now calls the same Home Assistant TV-on script used by Alexa rather than sending
# another raw Apple TV wakeup command.
deep_sleep:
  on_wake:
    - script.execute: wake_tv_after_reconnect

script:
  - id: wake_tv_after_reconnect
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "Deep-sleep recovery: waiting for Home Assistant subscription"
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 60s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            # ESPHome documents that Home Assistant action subscriptions can lag
            # the API connection itself. Do not send immediately on connect.
            - delay: 2s
            - logger.log: "Deep-sleep recovery: calling shared Home Assistant TV-on script"
            - homeassistant.action:
                action: script.tv_turn_on_the_tv_cable
            # Keep the sleep interlock asserted while the shared Home Assistant
            # power-on sequence and LG state catch up, even if the older v1.0.14
            # wake script times out and clears it.
            - repeat:
                count: 8
                then:
                  - delay: 5s
                  - lambda: 'id(tv_wake_in_progress) = true;'
            - lambda: 'id(tv_wake_in_progress) = false;'
            - script.execute: enter_tv_off_sleep
          else:
            - logger.log:
                level: ERROR
                format: "Deep-sleep recovery: Home Assistant did not become ready within 60 seconds"
            - lambda: 'id(tv_wake_in_progress) = false;'
