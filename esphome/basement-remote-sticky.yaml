# Basement Remote Sticky firmware
#
# v1.0.26 keeps the complete v1.0.25 behavior and suppresses repetitive RTTTL
# debug output while Find Remote is sounding. Start/stop events remain logged,
# while the per-phrase "Playing song" / "Playback finished" chatter is hidden.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.26"

packages:
  sticky_v1025_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: 4920a62fe3f47d14f967ed2fbcf9bb52cb4485bd
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

# The locator watchdog intentionally restarts a short RTTTL phrase whenever it
# finishes. RTTTL logs every start/finish at DEBUG, which is useful during bring-
# up but noisy during normal Find Remote use. Preserve warnings/errors while
# suppressing only that component's repetitive debug chatter.
logger:
  logs:
    rtttl: WARN
