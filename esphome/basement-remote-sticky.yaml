# Basement Remote Sticky firmware
#
# This file is designed to be consumed as a remote ESPHome Git package. Remote
# packages cannot perform !secret lookups, so the local Device Builder wrapper
# supplies credential substitutions from its local secrets.yaml file.
substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "0.2.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  project:
    name: citizenracer.basement_remote
    version: "${firmware_version}"
  on_boot:
    # Sticky's power latch can survive deep sleep/reset. Release any old holds
    # before normal GPIO setup, then explicitly assert the keep-alive rails.
    - priority: 900
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_42);
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_46);
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - switch.turn_on: touch_power_enable
        - delay: 1s
        - component.update: epaper_display
  on_shutdown:
    # Preserve the power-latch state across controlled resets. Deep sleep is
    # intentionally NOT enabled in Phase 1.
    then:
      - lambda: |-
          gpio_hold_en(GPIO_NUM_45);
          gpio_hold_en(GPIO_NUM_46);
          gpio_deep_sleep_hold_en();

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      # ESPHome 2026.8 requires this for OTA on ESP32-S3 targets with 32 MB flash.
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "Basement Remote Fallback"
    password: "${fallback_ap_password}"

captive_portal:

api:
  encryption:
    key: "${basement_remote_api_encryption_key}"
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "${ota_password}"

# E-paper and microSD share SCK/MOSI on Sticky. Phase 1 only uses the display.
spi:
  id: display_spi
  clk_pin: GPIO13
  mosi_pin: GPIO14

# Seeed's current Sticky hardware documentation specifies touch SCL=GPIO2,
# SDA=GPIO3. This is intentionally opposite the pin ordering in the original
# project notes; both Seeed's docs and a known-working ESPHome Sticky config
# agree on this assignment.
i2c:
  - id: touch_i2c
    scl: GPIO2
    sda:
      number: GPIO3
      # GPIO3 is a strapping pin, but this is the board's documented touch SDA.
      ignore_strapping_warning: true
    frequency: 100kHz
    scan: true

output:
  - platform: gpio
    id: pwr_hold
    pin:
      number: GPIO45
      ignore_strapping_warning: true

  - platform: gpio
    id: pwr_lock
    pin:
      number: GPIO46
      ignore_strapping_warning: true

switch:
  - platform: gpio
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100
    pin: GPIO42

binary_sensor:
  - platform: gpio
    id: button_ai_power
    name: "AI Power Button"
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "AI / Power button pressed"

  - platform: gpio
    id: button_up
    name: "Up Button"
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "Up button pressed"

  - platform: gpio
    id: button_down
    name: "Down Button"
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "Down button pressed"


script:
  # These are the same five remote.send_command actions used by the working
  # Home Assistant Basement Remote dashboard. Keeping each action explicit
  # makes the device behavior easy to audit and extend.
  - id: apple_tv_up
    mode: restart
    then:
      - logger.log: "Apple TV command: up"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: up

  - id: apple_tv_down
    mode: restart
    then:
      - logger.log: "Apple TV command: down"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: down

  - id: apple_tv_left
    mode: restart
    then:
      - logger.log: "Apple TV command: left"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: left

  - id: apple_tv_right
    mode: restart
    then:
      - logger.log: "Apple TV command: right"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: right

  - id: apple_tv_select
    mode: restart
    then:
      - logger.log: "Apple TV command: select"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: select

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: template
    id: last_touch_x
    name: "Last Touch X"
    unit_of_measurement: "px"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: last_touch_y
    name: "Last Touch Y"
    unit_of_measurement: "px"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

font:
  - file: "gfonts://Inter@700"
    id: font_heading
    size: 32
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-+/"

  - file: "gfonts://Inter@500"
    id: font_body
    size: 22
    glyphs: " abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-+/.:"

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-Sticky
    spi_id: display_spi
    rotation: 90
    update_interval: never
    full_update_every: 1
    lambda: |-
      const auto black = Color(0, 0, 0);
      const auto white = Color(255, 255, 255);
      const int w = it.get_width();
      const int h = it.get_height();

      it.fill(white);
      it.rectangle(0, 0, w, h, black);

      // Mostly-static e-paper face. Coordinates below are also the touch
      // targets used in sticky_touch.on_touch.
      it.filled_rectangle(0, 0, w, 82, black);
      it.printf(w / 2, 22, id(font_heading), white, TextAlign::TOP_CENTER,
                "APPLE TV");

      it.printf(w / 2, 100, id(font_body), black, TextAlign::TOP_CENTER,
                "BASEMENT NAVIGATION");

      // Up
      it.rectangle(160, 150, 160, 120, black);
      it.printf(240, 193, id(font_heading), black, TextAlign::TOP_CENTER, "UP");

      // Middle row: left, select, right
      it.rectangle(20, 290, 130, 160, black);
      it.printf(85, 350, id(font_body), black, TextAlign::TOP_CENTER, "LEFT");

      it.filled_rectangle(170, 290, 140, 160, black);
      it.printf(240, 348, id(font_heading), white, TextAlign::TOP_CENTER, "OK");

      it.rectangle(330, 290, 130, 160, black);
      it.printf(395, 350, id(font_body), black, TextAlign::TOP_CENTER, "RIGHT");

      // Down
      it.rectangle(160, 470, 160, 120, black);
      it.printf(240, 513, id(font_heading), black, TextAlign::TOP_CENTER, "DOWN");

      it.line(40, 650, w - 40, 650, black);
      it.printf(w / 2, 682, id(font_body), black, TextAlign::TOP_CENTER,
                "HOME ASSISTANT");
      it.printf(w / 2, 722, id(font_body), black, TextAlign::TOP_CENTER,
                "ENCRYPTED API");

touchscreen:
  - platform: gt911
    id: sticky_touch
    display: epaper_display
    i2c_id: touch_i2c
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    # The panel's native coordinate system is landscape. Match the display's
    # 90-degree clockwise software rotation to produce portrait coordinates.
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      then:
        - logger.log:
            format: "Touch x=%d y=%d"
            args: [touch.x, touch.y]
        - sensor.template.publish:
            id: last_touch_x
            state: !lambda return touch.x;
        - sensor.template.publish:
            id: last_touch_y
            state: !lambda return touch.y;
        - lambda: |-
            const int x = touch.x;
            const int y = touch.y;

            if (x >= 160 && x < 320 && y >= 150 && y < 270) {
              id(apple_tv_up).execute();
            } else if (x >= 20 && x < 150 && y >= 290 && y < 450) {
              id(apple_tv_left).execute();
            } else if (x >= 170 && x < 310 && y >= 290 && y < 450) {
              id(apple_tv_select).execute();
            } else if (x >= 330 && x < 460 && y >= 290 && y < 450) {
              id(apple_tv_right).execute();
            } else if (x >= 160 && x < 320 && y >= 470 && y < 590) {
              id(apple_tv_down).execute();
            } else {
              ESP_LOGD("touch", "Touch was outside a control");
            }

button:
  - platform: template
    name: "Refresh E-Paper"
    entity_category: diagnostic
    on_press:
      - component.update: epaper_display
