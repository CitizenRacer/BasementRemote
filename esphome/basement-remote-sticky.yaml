# Basement Remote Sticky firmware
#
# This file is designed to be consumed as a remote ESPHome Git package. Remote
# packages cannot perform !secret lookups, so the local Device Builder wrapper
# supplies credential substitutions from its local secrets.yaml file.
substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "0.2.4"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  project:
    name: citizenracer.basement_remote
    version: "${firmware_version}"
  on_boot:
    # Sticky's power latch can survive deep sleep/reset. Release any old holds
    # before normal GPIO setup, then explicitly assert the keep-alive rails.
    - priority: 900
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_42);
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_46);
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - switch.turn_on: touch_power_enable
        - delay: 1s
        - component.update: epaper_display
    - priority: -100
      then:
        - logger.log: "Basement Remote firmware ${firmware_version} ready"
  on_shutdown:
    # Preserve the power-latch state across controlled resets. Deep sleep is
    # intentionally NOT enabled in Phase 1.
    then:
      - lambda: |-
          gpio_hold_en(GPIO_NUM_45);
          gpio_hold_en(GPIO_NUM_46);
          gpio_deep_sleep_hold_en();

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      # ESPHome 2026.8 requires this for OTA on ESP32-S3 targets with 32 MB flash.
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "Basement Remote Fallback"
    password: "${fallback_ap_password}"

captive_portal:

api:
  encryption:
    key: "${basement_remote_api_encryption_key}"
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "${ota_password}"

# E-paper and microSD share SCK/MOSI on Sticky. Phase 1 only uses the display.
spi:
  id: display_spi
  clk_pin: GPIO13
  mosi_pin: GPIO14

# Seeed's current Sticky hardware documentation specifies touch SCL=GPIO2,
# SDA=GPIO3. This is intentionally opposite the pin ordering in the original
# project notes; both Seeed's docs and a known-working ESPHome Sticky config
# agree on this assignment.
i2c:
  - id: touch_i2c
    scl: GPIO2
    sda:
      number: GPIO3
      # GPIO3 is a strapping pin, but this is the board's documented touch SDA.
      ignore_strapping_warning: true
    frequency: 100kHz
    scan: true

output:
  - platform: gpio
    id: pwr_hold
    pin:
      number: GPIO45
      ignore_strapping_warning: true

  - platform: gpio
    id: pwr_lock
    pin:
      number: GPIO46
      ignore_strapping_warning: true

switch:
  - platform: gpio
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100
    pin: GPIO42

binary_sensor:
  - platform: gpio
    id: button_ai_power
    name: "AI Power Button"
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "AI / Power button pressed"

  - platform: gpio
    id: button_up
    name: "Volume Up Button"
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "Physical volume up button pressed"
      - script.execute: apple_tv_volume_up
      - delay: 500ms
      - while:
          condition:
            binary_sensor.is_on: button_up
          then:
            - script.execute: apple_tv_volume_up
            - delay: 175ms

  - platform: gpio
    id: button_down
    name: "Volume Down Button"
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "Physical volume down button pressed"
      - script.execute: apple_tv_volume_down
      - delay: 500ms
      - while:
          condition:
            binary_sensor.is_on: button_down
          then:
            - script.execute: apple_tv_volume_down
            - delay: 175ms


globals:
  - id: touch_active
    type: bool
    restore_value: false
    initial_value: "false"

  - id: touch_start_x
    type: int
    restore_value: false
    initial_value: "-1"

  - id: touch_start_y
    type: int
    restore_value: false
    initial_value: "-1"

  - id: touch_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: touch_last_repeat_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # 0 = not repeatable; 1..5 = up/down/left/right/select.
  - id: touch_repeat_command
    type: int
    restore_value: false
    initial_value: "0"

script:
  # Remote commands match the Apple TV defaults used by the working
  # custom:universal-remote-card dashboard.
  - id: apple_tv_wakeup
    mode: restart
    then:
      - logger.log: "Apple TV command: wakeup"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: wakeup

  - id: apple_tv_suspend
    mode: restart
    then:
      - logger.log: "Apple TV command: suspend"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: suspend

  - id: apple_tv_menu
    mode: restart
    then:
      - logger.log: "Apple TV command: menu"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: menu

  - id: apple_tv_home
    mode: restart
    then:
      - logger.log: "Apple TV command: home"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: home

  - id: apple_tv_skip_backward
    mode: restart
    then:
      - logger.log: "Apple TV command: skip_backward"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: skip_backward

  - id: apple_tv_play
    mode: restart
    then:
      - logger.log: "Apple TV command: play"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: play

  - id: apple_tv_pause
    mode: restart
    then:
      - logger.log: "Apple TV command: pause"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: pause

  - id: apple_tv_skip_forward
    mode: restart
    then:
      - logger.log: "Apple TV command: skip_forward"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: skip_forward

  - id: apple_tv_up
    mode: restart
    then:
      - logger.log: "Apple TV command: up"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: up

  - id: apple_tv_down
    mode: restart
    then:
      - logger.log: "Apple TV command: down"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: down

  - id: apple_tv_left
    mode: restart
    then:
      - logger.log: "Apple TV command: left"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: left

  - id: apple_tv_right
    mode: restart
    then:
      - logger.log: "Apple TV command: right"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: right

  - id: apple_tv_select
    mode: restart
    then:
      - logger.log: "Apple TV command: select"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: select

  - id: apple_tv_volume_down
    mode: restart
    then:
      - logger.log: "Apple TV command: volume_down"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: volume_down

  - id: apple_tv_volume_up
    mode: restart
    then:
      - logger.log: "Apple TV command: volume_up"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: volume_up

  - id: sonos_toggle_mute
    mode: restart
    then:
      - logger.log: "Sonos Arc command: toggle mute"
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: media_player.basement_sonos_arc
          data_template:
            is_volume_muted: >-
              {{ not state_attr('media_player.basement_sonos_arc',
                                'is_volume_muted') }}

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: template
    id: last_touch_x
    name: "Last Touch X"
    unit_of_measurement: "px"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: last_touch_y
    name: "Last Touch Y"
    unit_of_measurement: "px"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

font:
  # Material Design Icons v7.4.47, pinned so glyph codepoints cannot drift.
  # This is the only display font: the remote face intentionally has no text.
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_mdi
    size: 60
    bpp: 1
    glyphsets: []
    glyphs:
      - "\U000F0425" # mdi-power
      - "\U000F035C" # mdi-menu
      - "\U000F02DC" # mdi-home
      - "\U000F04AB" # mdi-skip-backward
      - "\U000F040A" # mdi-play
      - "\U000F03E4" # mdi-pause
      - "\U000F04AC" # mdi-skip-forward
      - "\U000F0143" # mdi-chevron-up
      - "\U000F0140" # mdi-chevron-down
      - "\U000F0141" # mdi-chevron-left
      - "\U000F0142" # mdi-chevron-right
      - "\U000F0766" # mdi-circle-outline
      - "\U000F075F" # mdi-volume-mute

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-Sticky
    spi_id: display_spi
    rotation: 90
    update_interval: never
    full_update_every: 1
    lambda: |-
      const auto black = Color(0, 0, 0);
      const auto white = Color(255, 255, 255);
      const int w = it.get_width();
      const int h = it.get_height();

      it.fill(white);
      it.rectangle(0, 0, w, h, black);

      // Full-height, icon-only remote face. Every rectangle exactly matches
      // a touch target in sticky_touch.on_touch/on_release.

      // Power, menu, home.
      it.rectangle(10, 20, 146, 100, black);
      it.printf(83, 70, id(font_mdi), black, TextAlign::CENTER, "\U000F0425");
      it.rectangle(167, 20, 146, 100, black);
      it.printf(240, 70, id(font_mdi), black, TextAlign::CENTER, "\U000F035C");
      it.rectangle(324, 20, 146, 100, black);
      it.printf(397, 70, id(font_mdi), black, TextAlign::CENTER, "\U000F02DC");

      // Playback.
      it.rectangle(8, 140, 110, 100, black);
      it.printf(63, 190, id(font_mdi), black, TextAlign::CENTER, "\U000F04AB");
      it.rectangle(126, 140, 110, 100, black);
      it.printf(181, 190, id(font_mdi), black, TextAlign::CENTER, "\U000F040A");
      it.rectangle(244, 140, 110, 100, black);
      it.printf(299, 190, id(font_mdi), black, TextAlign::CENTER, "\U000F03E4");
      it.rectangle(362, 140, 110, 100, black);
      it.printf(417, 190, id(font_mdi), black, TextAlign::CENTER, "\U000F04AC");

      // D-pad.
      it.rectangle(145, 270, 190, 110, black);
      it.printf(240, 325, id(font_mdi), black, TextAlign::CENTER, "\U000F0143");
      it.rectangle(20, 400, 135, 140, black);
      it.printf(87, 470, id(font_mdi), black, TextAlign::CENTER, "\U000F0141");
      it.filled_rectangle(172, 400, 136, 140, black);
      it.printf(240, 470, id(font_mdi), white, TextAlign::CENTER, "\U000F0766");
      it.rectangle(325, 400, 135, 140, black);
      it.printf(392, 470, id(font_mdi), black, TextAlign::CENTER, "\U000F0142");
      it.rectangle(145, 560, 190, 110, black);
      it.printf(240, 615, id(font_mdi), black, TextAlign::CENTER, "\U000F0140");

      // Volume is handled by the two physical side buttons.
      it.filled_rectangle(120, 690, 240, 90, black);
      it.printf(240, 735, id(font_mdi), white, TextAlign::CENTER, "\U000F075F");

touchscreen:
  - platform: gt911
    id: sticky_touch
    display: epaper_display
    i2c_id: touch_i2c
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    # The panel's native coordinate system is landscape. Match the display's
    # 90-degree clockwise software rotation to produce portrait coordinates.
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      then:
        - logger.log:
            format: "Touch x=%d y=%d"
            args: [touch.x, touch.y]
        - sensor.template.publish:
            id: last_touch_x
            state: !lambda return touch.x;
        - sensor.template.publish:
            id: last_touch_y
            state: !lambda return touch.y;
        - lambda: |-
            const int x = touch.x;
            const int y = touch.y;
            const uint32_t now = millis();

            id(touch_active) = true;
            id(touch_start_x) = x;
            id(touch_start_y) = y;
            id(touch_started_ms) = now;
            id(touch_last_repeat_ms) = now;
            id(touch_repeat_command) = 0;

            // Repeatable controls fire immediately, then the interval below
            // repeats them after a deliberate hold.
            if (x >= 145 && x < 335 && y >= 270 && y < 380) {
              id(touch_repeat_command) = 1;
              id(apple_tv_up).execute();
            } else if (x >= 145 && x < 335 && y >= 560 && y < 670) {
              id(touch_repeat_command) = 2;
              id(apple_tv_down).execute();
            } else if (x >= 20 && x < 155 && y >= 400 && y < 540) {
              id(touch_repeat_command) = 3;
              id(apple_tv_left).execute();
            } else if (x >= 325 && x < 460 && y >= 400 && y < 540) {
              id(touch_repeat_command) = 4;
              id(apple_tv_right).execute();
            } else if (x >= 172 && x < 308 && y >= 400 && y < 540) {
              id(touch_repeat_command) = 5;
              id(apple_tv_select).execute();
            }
    on_release:
      then:
        - lambda: |-
            if (!id(touch_active)) {
              return;
            }

            const int x = id(touch_start_x);
            const int y = id(touch_start_y);
            const uint32_t held_ms = millis() - id(touch_started_ms);

            // Repeatable controls already fired on touch.
            if (id(touch_repeat_command) == 0) {
              if (x >= 10 && x < 156 && y >= 20 && y < 120) {
                if (held_ms >= 800) {
                  id(apple_tv_suspend).execute();
                } else {
                  id(apple_tv_wakeup).execute();
                }
              } else if (x >= 167 && x < 313 && y >= 20 && y < 120) {
                id(apple_tv_menu).execute();
              } else if (x >= 324 && x < 470 && y >= 20 && y < 120) {
                id(apple_tv_home).execute();
              } else if (x >= 8 && x < 118 && y >= 140 && y < 240) {
                id(apple_tv_skip_backward).execute();
              } else if (x >= 126 && x < 236 && y >= 140 && y < 240) {
                id(apple_tv_play).execute();
              } else if (x >= 244 && x < 354 && y >= 140 && y < 240) {
                id(apple_tv_pause).execute();
              } else if (x >= 362 && x < 472 && y >= 140 && y < 240) {
                id(apple_tv_skip_forward).execute();
              } else if (x >= 120 && x < 360 && y >= 690 && y < 780) {
                id(sonos_toggle_mute).execute();
              } else {
                ESP_LOGD("touch", "Touch was outside a control");
              }
            }

            id(touch_active) = false;
            id(touch_repeat_command) = 0;

interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(touch_active) || id(touch_repeat_command) == 0) {
            return;
          }

          const uint32_t now = millis();
          if ((now - id(touch_started_ms)) < 500 ||
              (now - id(touch_last_repeat_ms)) < 175) {
            return;
          }
          id(touch_last_repeat_ms) = now;

          switch (id(touch_repeat_command)) {
            case 1: id(apple_tv_up).execute(); break;
            case 2: id(apple_tv_down).execute(); break;
            case 3: id(apple_tv_left).execute(); break;
            case 4: id(apple_tv_right).execute(); break;
            case 5: id(apple_tv_select).execute(); break;
            default: break;
          }

button:
  - platform: template
    name: "Refresh E-Paper"
    entity_category: diagnostic
    on_press:
      - component.update: epaper_display
