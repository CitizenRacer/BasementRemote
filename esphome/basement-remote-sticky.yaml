# Basement Remote Sticky firmware
#
# v1.0.17 backs out the v1.0.15/v1.0.16 early PWR_HOLD/PWR_LOCK override that
# could collapse the Sticky's power latch during wake. It keeps the last known
# good v1.0.14 hardware wake sequence intact, adds only a GT911-only recovery
# pulse after that known-good latch restoration, and keeps the shared Home
# Assistant/Alexa TV-on recovery path.
#
# This file is still the production package consumed by Device Builder.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.17"

packages:
  sticky_v1014_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: dc4113e58f1b3d96a08825d5e63aadbaac05603b
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

# IMPORTANT: Do not release or manipulate GPIO45/GPIO46/GPIO47 here. The
# hardware-validated v1.0.14 base owns the power-latch/display-rail sequence.
# Its priority-900 boot step restores those retained levels at the timing that
# has proven to wake the physical unit reliably.
#
# Touch recovery is isolated to GPIO42 only. By priority 700 the v1.0.14 base
# has already released the retained GPIO42 hold and driven the touch rail high.
# Cold-cycle only that rail before normal GT911 setup, leaving PWR_HOLD and
# PWR_LOCK untouched.
esphome:
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 0);
            delay(25);
            gpio_set_level(GPIO_NUM_42, 1);
            delay(150);
            ESP_LOGI("touch", "GT911-only recovery pulse complete; power latch untouched");

    - priority: -110
      then:
        - logger.log: "Basement Remote v1.0.17 recovery initialization complete"

# Home Assistant can authenticate the ESPHome API before it has subscribed to
# device actions. Keep the reconnect path conservative and wait for a state-
# subscribing Home Assistant client plus a short grace period before invoking
# the shared TV-on script.
api:
  id: remote_api
  on_client_connected:
    - delay: 2s
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - logger.log: "Home Assistant API subscription is ready for remote actions"

# Keep the v1.0.14 physical GPIO4 deep-sleep wake configuration unchanged. Add
# only a secondary recovery action after wake; this does not change the wake pin
# or the known-good latch sequencing.
deep_sleep:
  on_wake:
    - script.execute: wake_tv_after_reconnect

script:
  - id: wake_tv_after_reconnect
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "Deep-sleep recovery: waiting for Home Assistant subscription"
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 60s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - delay: 2s
            - logger.log: "Deep-sleep recovery: calling shared Home Assistant TV-on script"
            - homeassistant.action:
                action: script.tv_turn_on_the_tv_cable
            - repeat:
                count: 8
                then:
                  - delay: 5s
                  - lambda: 'id(tv_wake_in_progress) = true;'
            - lambda: 'id(tv_wake_in_progress) = false;'
            - script.execute: enter_tv_off_sleep
          else:
            - logger.log:
                level: ERROR
                format: "Deep-sleep recovery: Home Assistant did not become ready within 60 seconds"
            - lambda: 'id(tv_wake_in_progress) = false;'
