# Basement Remote Sticky firmware
#
# This file is designed to be consumed as a remote ESPHome Git package. Remote
# packages cannot perform !secret lookups, so the local Device Builder wrapper
# supplies credential substitutions from its local secrets.yaml file.
substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.14"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  project:
    name: citizenracer.basement_remote
    version: "${firmware_version}"
  on_boot:
    # Sticky's power latch can survive deep sleep/reset. Release any old holds
    # before normal GPIO setup, then explicitly assert the keep-alive rails.
    - priority: 900
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_42);
            // GPIO42 is held low while asleep to remove power from the GT911.
            // The GPIO switch component has already restored its logical ON
            // state at this point, so drive the physical pin high immediately
            // after releasing the hold. This guarantees the GT911 is powered
            // before its startup reset/calibration sequence runs.
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 1);
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_hold_dis(GPIO_NUM_47);
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - switch.turn_on: touch_power_enable
        # Yield briefly so the GT911 can complete its reset/init sequence before
        # the full e-paper refresh occupies startup. This replaces the old 1s wait.
        - delay: 100ms
        - component.update: epaper_display
    - priority: -100
      then:
        - logger.log: "Basement Remote firmware ${firmware_version} ready"
  on_shutdown:
    # Preserve the battery power latch, shut down the touch/display rails, and
    # hold those levels through deep sleep.
    then:
      - switch.turn_off: touch_power_enable
      - lambda: |-
          gpio_set_level(GPIO_NUM_47, 0);
          gpio_hold_en(GPIO_NUM_42);
          gpio_hold_en(GPIO_NUM_45);
          gpio_hold_en(GPIO_NUM_46);
          gpio_hold_en(GPIO_NUM_47);
          gpio_deep_sleep_hold_en();

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      # ESPHome 2026.8 requires this for OTA on ESP32-S3 targets with 32 MB flash.
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "Basement Remote Fallback"
    password: "${fallback_ap_password}"

captive_portal:

api:
  encryption:
    key: "${basement_remote_api_encryption_key}"
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "${ota_password}"

# E-paper and microSD share SCK/MOSI on Sticky. The remote uses the display;
# the microSD interface is intentionally unused.
spi:
  id: display_spi
  clk_pin: GPIO13
  mosi_pin: GPIO14

# Sticky has two independent I2C buses: the BQ27220 fuel gauge is on GPIO0/1,
# while the GT911 touchscreen is on GPIO2/3.
i2c:
  - id: sensor_i2c
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    sda: GPIO1
    frequency: 400kHz

  - id: touch_i2c
    scl: GPIO2
    sda:
      number: GPIO3
      # GPIO3 is a strapping pin, but this is the board's documented touch SDA.
      ignore_strapping_warning: true
    frequency: 100kHz
    scan: true

output:
  - platform: gpio
    id: pwr_hold
    pin:
      number: GPIO45
      ignore_strapping_warning: true

  - platform: gpio
    id: pwr_lock
    pin:
      number: GPIO46
      ignore_strapping_warning: true

switch:
  - platform: gpio
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100
    pin: GPIO42

binary_sensor:
  - platform: gpio
    id: button_ai_power
    name: "AI Power Button"
    pin:
      number: GPIO4
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "AI / Power button pressed"
      - lambda: |-
          // deep_sleep.on_wake starts the timer for the press that woke the
          // device. Normal awake presses start timing here.
          if (!id(woke_from_tv_off_sleep)) {
            id(ai_power_pressed_ms) = millis();
          }
          id(tv_wake_in_progress) = true;
    on_release:
      - lambda: |-
          const bool was_sleep_wake = id(woke_from_tv_off_sleep);
          id(woke_from_tv_off_sleep) = false;

          // A press that woke deep sleep has already queued TV-on from
          // deep_sleep.on_wake. Do not classify its release as a second power
          // command; that was the race that could leave the TV off or reverse
          // a wake with a later suspend.
          if (was_sleep_wake) {
            ESP_LOGD("power", "Ignoring release classification for deep-sleep wake press");
            return;
          }

          const uint32_t held_ms = millis() - id(ai_power_pressed_ms);
          if (held_ms >= 800) {
            ESP_LOGI("power", "AI / Power long press (%u ms): TV off", held_ms);
            id(turn_tv_off_after_power_button).execute();
          } else {
            ESP_LOGI("power", "AI / Power short press (%u ms): TV on", held_ms);
            id(wake_tv_after_power_button).execute();
          }

  - platform: gpio
    id: button_up
    name: "Volume Up Button"
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "Physical volume up button pressed"
      - script.execute: apple_tv_volume_up
      - delay: 500ms
      - while:
          condition:
            binary_sensor.is_on: button_up
          then:
            - script.execute: apple_tv_volume_up
            - delay: 175ms

  - platform: gpio
    id: button_down
    name: "Volume Down Button"
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "Physical volume down button pressed"
      - script.execute: apple_tv_volume_down
      - delay: 500ms
      - while:
          condition:
            binary_sensor.is_on: button_down
          then:
            - script.execute: apple_tv_volume_down
            - delay: 175ms

  - platform: template
    id: battery_charging
    name: "Battery Charging"
    device_class: battery_charging
    lambda: |-
      return id(battery_current).has_state() && id(battery_current).state > 10.0f;


globals:
  - id: touch_active
    type: bool
    restore_value: false
    initial_value: "false"

  - id: touch_start_x
    type: int
    restore_value: false
    initial_value: "-1"

  - id: touch_start_y
    type: int
    restore_value: false
    initial_value: "-1"

  - id: touch_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: touch_last_repeat_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # 0 = not repeatable; 1..5 = up/down/left/right/select.
  - id: touch_repeat_command
    type: int
    restore_value: false
    initial_value: "0"

  - id: woke_from_tv_off_sleep
    type: bool
    restore_value: false
    initial_value: "false"

  - id: ai_power_pressed_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Blocks TV-off sleep while a power command is being classified or while
  # Home Assistant / HDMI-CEC state is converging after a power command.
  - id: tv_wake_in_progress
    type: bool
    restore_value: false
    initial_value: "false"

  # True only for the final e-paper refresh immediately before deep sleep.
  - id: sleep_display_active
    type: bool
    restore_value: false
    initial_value: "false"

  # Stored across deep sleep so an e-paper low-battery warning is refreshed
  # only when the <=20% threshold actually changes.
  - id: battery_low_displayed
    type: bool
    restore_value: true
    initial_value: "false"

script:
  - id: wake_tv_after_power_button
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "AI / Power wake: waiting for Home Assistant"
      - wait_until:
          condition:
            api.connected:
          timeout: 20s
      - if:
          condition:
            api.connected:
          then:
            - script.execute: apple_tv_wakeup
          else:
            - logger.log:
                level: ERROR
                format: "AI / Power wake: Home Assistant did not connect"
      # Give HDMI-CEC and the LG integration time to report the TV as on.
      - delay: 30s
      - lambda: 'id(tv_wake_in_progress) = false;'
      - if:
          condition:
            lambda: |-
              return id(basement_tv_state).has_state() &&
                     id(basement_tv_state).state == "off";
          then:
            - script.execute: enter_tv_off_sleep

  - id: turn_tv_off_after_power_button
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "AI / Power long press: waiting for Home Assistant"
      - wait_until:
          condition:
            api.connected:
          timeout: 20s
      - if:
          condition:
            api.connected:
          then:
            - script.execute: apple_tv_suspend
          else:
            - logger.log:
                level: ERROR
                format: "AI / Power long press: Home Assistant did not connect"
      # Allow Apple TV suspend -> HDMI-CEC -> LG state to settle, then use the
      # confirmed LG state as the authority for whether deep sleep is safe.
      - delay: 15s
      - lambda: 'id(tv_wake_in_progress) = false;'
      - script.execute: enter_tv_off_sleep

  - id: enter_tv_off_sleep
    mode: restart
    then:
      # Debounce transient media-player states and allow any e-paper refresh
      # already in flight to finish before drawing the sleep face.
      - delay: 10s
      - if:
          condition:
            lambda: |-
              return id(basement_tv_state).has_state() &&
                     id(basement_tv_state).state == "off" &&
                     !id(tv_wake_in_progress);
          then:
            - logger.log: "Basement TV is off; entering remote deep sleep"
            - script.execute: render_sleep_and_enter

  - id: render_sleep_and_enter
    mode: restart
    then:
      # Every display update is already a full SSD1677 refresh because
      # full_update_every is 1. Rendering an explicit white frame first only
      # creates a long blank interval. Draw the final sleep face directly and
      # keep the ESP32 awake long enough for that asynchronous full refresh to
      # finish before display power is removed.
      - logger.log: "Rendering approved sleep face"
      - lambda: 'id(sleep_display_active) = true;'
      - component.update: epaper_display
      - delay: 10s
      - logger.log: "Sleep face rendered; entering deep sleep"
      - deep_sleep.enter: tv_power_sleep

  # Remote commands match the Apple TV defaults used by the working
  # custom:universal-remote-card dashboard.
  - id: apple_tv_wakeup
    mode: restart
    then:
      - logger.log: "Apple TV command: wakeup"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: wakeup

  - id: apple_tv_suspend
    mode: restart
    then:
      - logger.log: "Apple TV command: suspend"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: suspend

  - id: apple_tv_menu
    mode: restart
    then:
      - logger.log: "Apple TV command: menu"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: menu

  - id: apple_tv_home
    mode: restart
    then:
      - logger.log: "Apple TV command: home"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: home

  - id: apple_tv_skip_backward
    mode: restart
    then:
      - logger.log: "Apple TV command: skip_backward"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: skip_backward

  - id: apple_tv_play
    mode: restart
    then:
      - logger.log: "Apple TV command: play"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: play

  - id: apple_tv_pause
    mode: restart
    then:
      - logger.log: "Apple TV command: pause"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: pause

  - id: apple_tv_skip_forward
    mode: restart
    then:
      - logger.log: "Apple TV command: skip_forward"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: skip_forward

  - id: apple_tv_up
    mode: restart
    then:
      - logger.log: "Apple TV command: up"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: up

  - id: apple_tv_down
    mode: restart
    then:
      - logger.log: "Apple TV command: down"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: down

  - id: apple_tv_left
    mode: restart
    then:
      - logger.log: "Apple TV command: left"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: left

  - id: apple_tv_right
    mode: restart
    then:
      - logger.log: "Apple TV command: right"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: right

  - id: apple_tv_select
    mode: restart
    then:
      - logger.log: "Apple TV command: select"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: select

  - id: apple_tv_volume_down
    mode: restart
    then:
      - logger.log: "Apple TV command: volume_down"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: volume_down

  - id: apple_tv_volume_up
    mode: restart
    then:
      - logger.log: "Apple TV command: volume_up"
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.basement_apple_tv
            command: volume_up

  - id: apple_tv_launch_hulu
    mode: restart
    then:
      - logger.log: "Apple TV app: Hulu"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: media_player.basement_apple_tv
            source: Hulu

  - id: apple_tv_launch_hbo_max
    mode: restart
    then:
      - logger.log: "Apple TV app: HBO Max"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: media_player.basement_apple_tv
            source: HBO Max

  - id: apple_tv_launch_disney_plus
    mode: restart
    then:
      - logger.log: "Apple TV app: Disney+"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: media_player.basement_apple_tv
            source: Disney+

  - id: apple_tv_launch_paramount_plus
    mode: restart
    then:
      - logger.log: "Apple TV app: Paramount+"
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: media_player.basement_apple_tv
            source: Paramount+

sensor:
  # BQ27220 fuel gauge at 0x55. The standard data registers are little-endian.
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(sensor_i2c).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      const uint16_t value = static_cast<uint16_t>(raw[0]) |
                             (static_cast<uint16_t>(raw[1]) << 8);
      if (value > 100) {
        return NAN;
      }
      return static_cast<float>(value);
    on_value:
      then:
        - lambda: |-
            if (x < 0.0f || x > 100.0f) {
              return;
            }
            const bool low = x <= 20.0f;
            if (low != id(battery_low_displayed)) {
              id(battery_low_displayed) = low;
              id(epaper_display).update();
            }

  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x08;
      uint8_t raw[2] = {0, 0};
      auto err = id(sensor_i2c).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      const uint16_t millivolts = static_cast<uint16_t>(raw[0]) |
                                  (static_cast<uint16_t>(raw[1]) << 8);
      return static_cast<float>(millivolts) / 1000.0f;

  - platform: template
    id: battery_current
    name: "Battery Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x0C;
      uint8_t raw[2] = {0, 0};
      auto err = id(sensor_i2c).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      const uint16_t raw_value = static_cast<uint16_t>(raw[0]) |
                                 (static_cast<uint16_t>(raw[1]) << 8);
      return static_cast<float>(static_cast<int16_t>(raw_value));

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: template
    id: last_touch_x
    name: "Last Touch X"
    unit_of_measurement: "px"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: last_touch_y
    name: "Last Touch Y"
    unit_of_measurement: "px"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

  # The LG TV state imported from Home Assistant is both the authority for the
  # automatic sleep decision and an exposed diagnostic so the exact state the
  # Sticky is acting on can be inspected in Home Assistant.
  - platform: homeassistant
    id: basement_tv_state
    name: "TV State Seen By Remote"
    internal: false
    entity_category: diagnostic
    entity_id: media_player.basement_tv
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(basement_tv_state).state == "off";'
            then:
              - script.execute: enter_tv_off_sleep
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(basement_tv_state).state != "unknown" &&
                             id(basement_tv_state).state != "unavailable";
                  then:
                    - lambda: 'id(tv_wake_in_progress) = false;'

image:
  # All build-time artwork is vendored in this repository. ESPHome currently
  # resolves local image paths relative to the Device Builder wrapper rather
  # than a remote package's cached checkout, so the package references the
  # same repository's raw main branch instead of third-party asset hosts.
  - platform: file
    defaults:
      type: BINARY
      transparency: chroma_key
      resize: 60x60
    files:
      - id: icon_back
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/arrow-uturn-left.svg
      - id: icon_home
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/home.svg
      - id: icon_skip_backward
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/backward.svg
      - id: icon_play
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/play.svg
      - id: icon_pause
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/pause.svg
      - id: icon_skip_forward
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/forward.svg
      - id: icon_up
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/chevron-up.svg
      - id: icon_down
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/chevron-down.svg
      - id: icon_left
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/chevron-left.svg
      - id: icon_right
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/chevron-right.svg
      - id: icon_select
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/vendor/heroicons-v2.2.0/cursor-arrow-ripple.svg

  - platform: file
    files:
      - id: sleep_screen_art
        # Pin the vector-only sleep artwork so builds cannot reuse an older
        # cached asset that still contains live SVG text elements.
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/1aaf4d8b8ba0dd5c8ddf28dacdb67f34c62b3fc2/assets/sleep-screen.svg
        type: BINARY
        transparency: chroma_key
        resize: 480x800
        invert_alpha: true

  # Streaming-service logos are also repo-owned so an upstream logo host or
  # path change cannot break a firmware build.
  - platform: file
    defaults:
      type: BINARY
      transparency: chroma_key
    files:
      - id: logo_hulu
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/hulu.svg
        resize: 90x30
      - id: logo_hbo_max
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/hbo-max.svg
        resize: 72x52
      - id: logo_paramount_plus
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/paramount-plus.svg
        resize: 86x56

  - platform: file
    defaults:
      type: BINARY
      transparency: chroma_key
      invert_alpha: true
    files:
      - id: logo_disney_plus
        file: https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/disney-d.png
        resize: 60x60

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-Sticky
    spi_id: display_spi
    rotation: 90
    update_interval: 10min
    full_update_every: 1
    lambda: |-
      const auto black = Color(0, 0, 0);
      const auto white = Color(255, 255, 255);
      const int w = it.get_width();
      const int h = it.get_height();

      it.fill(white);
      it.rectangle(0, 0, w, h, black);

      // The approved 480x800 sleep artwork is a single deterministic 1-bit
      // asset: moon/Z icon, outlined Sleeping label, outlined wake instruction,
      // and two-loop arrow aimed at the physical AI / Power button at ~14%.
      if (id(sleep_display_active)) {
        it.image(0, 0, id(sleep_screen_art), ImageAlign::TOP_LEFT, black, white);
        return;
      }

      // Small local primitives keep the static remote face dependency-free.
      // Outlined controls use a two-pixel rounded border; filled controls use
      // the same corner radius so the visual language stays consistent.
      auto fill_rounded_rect = [&](int x, int y, int width, int height,
                                   int radius, Color color) {
        const int r = std::min(radius, std::min(width, height) / 2);
        it.filled_rectangle(x + r, y, width - 2 * r, height, color);
        it.filled_rectangle(x, y + r, width, height - 2 * r, color);
        it.filled_circle(x + r, y + r, r, color);
        it.filled_circle(x + width - r - 1, y + r, r, color);
        it.filled_circle(x + r, y + height - r - 1, r, color);
        it.filled_circle(x + width - r - 1, y + height - r - 1, r, color);
      };
      auto rounded_rect = [&](int x, int y, int width, int height, int radius) {
        fill_rounded_rect(x, y, width, height, radius, black);
        fill_rounded_rect(x + 2, y + 2, width - 4, height - 4,
                          std::max(0, radius - 2), white);
      };

      // Show a tiny battery glyph only when the fuel gauge reports <=20%.
      // The screen is refreshed only when this threshold changes.
      if (id(battery_low_displayed)) {
        it.rectangle(443, 14, 24, 12, black);
        it.filled_rectangle(467, 17, 3, 6, black);
        it.filled_rectangle(446, 17, 5, 6, black);
      }

      // Full-height, icon-only remote face. Physical AI is the sole power
      // control, leaving the entire touchscreen for navigation and media.

      // Primary navigation: largest and highest controls on the face.
      rounded_rect(150, 30, 180, 90, 14);
      it.image(240, 75, id(icon_up), ImageAlign::CENTER, black, white);
      // Left/right are the same 180x90 control as up/down, rotated 90 deg.
      rounded_rect(45, 100, 90, 180, 14);
      it.image(90, 190, id(icon_left), ImageAlign::CENTER, black, white);
      fill_rounded_rect(170, 135, 140, 110, 14, black);
      it.image(240, 190, id(icon_select), ImageAlign::CENTER, white, black);
      rounded_rect(345, 100, 90, 180, 14);
      it.image(390, 190, id(icon_right), ImageAlign::CENTER, black, white);
      rounded_rect(150, 260, 180, 90, 14);
      it.image(240, 305, id(icon_down), ImageAlign::CENTER, black, white);

      // Secondary navigation directly below the D-pad.
      rounded_rect(60, 390, 160, 90, 14);
      it.image(140, 435, id(icon_back), ImageAlign::CENTER, black, white);
      rounded_rect(260, 390, 160, 90, 14);
      it.image(340, 435, id(icon_home), ImageAlign::CENTER, black, white);

      // Playback transport.
      rounded_rect(8, 515, 110, 90, 14);
      it.image(63, 560, id(icon_skip_backward), ImageAlign::CENTER, black, white);
      rounded_rect(126, 515, 110, 90, 14);
      it.image(181, 560, id(icon_play), ImageAlign::CENTER, black, white);
      rounded_rect(244, 515, 110, 90, 14);
      it.image(299, 560, id(icon_pause), ImageAlign::CENTER, black, white);
      rounded_rect(362, 515, 110, 90, 14);
      it.image(417, 560, id(icon_skip_forward), ImageAlign::CENTER, black, white);

      // Volume remains on the physical side buttons. The bottom row is
      // dedicated to one-touch Apple TV streaming-service launchers.
      rounded_rect(8, 665, 110, 100, 14);
      it.image(63, 715, id(logo_hulu), ImageAlign::CENTER, black, white);
      rounded_rect(126, 665, 110, 100, 14);
      it.image(181, 715, id(logo_hbo_max), ImageAlign::CENTER, black, white);
      rounded_rect(244, 665, 110, 100, 14);
      it.image(299, 715, id(logo_disney_plus), ImageAlign::CENTER, black, white);
      rounded_rect(362, 665, 110, 100, 14);
      it.image(417, 715, id(logo_paramount_plus), ImageAlign::CENTER, black, white);

touchscreen:
  - platform: gt911
    id: sticky_touch
    display: epaper_display
    i2c_id: touch_i2c
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    # Physical calibration on the portrait UI shows that the GT911 native X
    # axis already matches portrait X. Native Y runs in the opposite direction,
    # so mirror Y only. Do not swap axes: doing so rotates every hit region.
    transform:
      mirror_y: true
    on_touch:
      then:
        - logger.log:
            format: "Touch x=%d y=%d"
            args: [touch.x, touch.y]
        - sensor.template.publish:
            id: last_touch_x
            state: !lambda return touch.x;
        - sensor.template.publish:
            id: last_touch_y
            state: !lambda return touch.y;
        - lambda: |-
            const int x = touch.x;
            const int y = touch.y;
            const uint32_t now = millis();

            id(touch_active) = true;
            id(touch_start_x) = x;
            id(touch_start_y) = y;
            id(touch_started_ms) = now;
            id(touch_last_repeat_ms) = now;
            id(touch_repeat_command) = 0;

            // Repeatable controls fire immediately, then the interval below
            // repeats them after a deliberate hold.
            if (x >= 150 && x < 330 && y >= 30 && y < 120) {
              id(touch_repeat_command) = 1;
              id(apple_tv_up).execute();
            } else if (x >= 150 && x < 330 && y >= 260 && y < 350) {
              id(touch_repeat_command) = 2;
              id(apple_tv_down).execute();
            } else if (x >= 45 && x < 135 && y >= 100 && y < 280) {
              id(touch_repeat_command) = 3;
              id(apple_tv_left).execute();
            } else if (x >= 345 && x < 435 && y >= 100 && y < 280) {
              id(touch_repeat_command) = 4;
              id(apple_tv_right).execute();
            } else if (x >= 170 && x < 310 && y >= 135 && y < 245) {
              id(touch_repeat_command) = 5;
              id(apple_tv_select).execute();
            }
    on_release:
      then:
        - lambda: |-
            if (!id(touch_active)) {
              return;
            }

            const int x = id(touch_start_x);
            const int y = id(touch_start_y);

            // Repeatable controls already fired on touch.
            if (id(touch_repeat_command) == 0) {
              if (x >= 60 && x < 220 && y >= 390 && y < 480) {
                id(apple_tv_menu).execute();
              } else if (x >= 260 && x < 420 && y >= 390 && y < 480) {
                id(apple_tv_home).execute();
              } else if (x >= 8 && x < 118 && y >= 515 && y < 605) {
                id(apple_tv_skip_backward).execute();
              } else if (x >= 126 && x < 236 && y >= 515 && y < 605) {
                id(apple_tv_play).execute();
              } else if (x >= 244 && x < 354 && y >= 515 && y < 605) {
                id(apple_tv_pause).execute();
              } else if (x >= 362 && x < 472 && y >= 515 && y < 605) {
                id(apple_tv_skip_forward).execute();
              } else if (x >= 8 && x < 118 && y >= 665 && y < 765) {
                id(apple_tv_launch_hulu).execute();
              } else if (x >= 126 && x < 236 && y >= 665 && y < 765) {
                id(apple_tv_launch_hbo_max).execute();
              } else if (x >= 244 && x < 354 && y >= 665 && y < 765) {
                id(apple_tv_launch_disney_plus).execute();
              } else if (x >= 362 && x < 472 && y >= 665 && y < 765) {
                id(apple_tv_launch_paramount_plus).execute();
              } else {
                ESP_LOGD("touch", "Touch was outside a control");
              }
            }

            id(touch_active) = false;
            id(touch_repeat_command) = 0;

# Sleep indefinitely whenever the physical LG TV is confirmed off. GPIO4 is
# the active-low AI / Power button and the only wake source. A wake press always
# queues TV-on as soon as the ESPHome native API reconnects; awake presses retain
# the normal short=on / long=off classification.
deep_sleep:
  id: tv_power_sleep
  wakeup_pin:
    number: GPIO4
    allow_other_uses: true
    inverted: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: KEEP_AWAKE
  on_wake:
    - lambda: |-
        id(woke_from_tv_off_sleep) = true;
        id(ai_power_pressed_ms) = millis();
        id(tv_wake_in_progress) = true;
    - logger.log: "AI / Power woke remote from TV-off deep sleep; waking TV"
    - script.execute: wake_tv_after_power_button
    # Normally on_release clears the wake marker. If the release occurred before
    # the GPIO binary sensor finished startup, clear the stale marker here so a
    # later awake press cannot be misclassified using the old wake timestamp.
    - delay: 5s
    - lambda: |-
        if (id(woke_from_tv_off_sleep)) {
          ESP_LOGW("power", "Wake-button release was not observed; clearing wake classification");
          id(woke_from_tv_off_sleep) = false;
        }

interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(touch_active) || id(touch_repeat_command) == 0) {
            return;
          }

          const uint32_t now = millis();
          if ((now - id(touch_started_ms)) < 500 ||
              (now - id(touch_last_repeat_ms)) < 175) {
            return;
          }
          id(touch_last_repeat_ms) = now;

          switch (id(touch_repeat_command)) {
            case 1: id(apple_tv_up).execute(); break;
            case 2: id(apple_tv_down).execute(); break;
            case 3: id(apple_tv_left).execute(); break;
            case 4: id(apple_tv_right).execute(); break;
            case 5: id(apple_tv_select).execute(); break;
            default: break;
          }

button:
  - platform: template
    name: "Sleep Remote"
    icon: "mdi:sleep"
    on_press:
      - logger.log: "Home Assistant requested remote deep sleep"
      - script.execute: render_sleep_and_enter

  - platform: template
    name: "Refresh E-Paper"
    entity_category: diagnostic
    on_press:
      - component.update: epaper_display
