# Basement Remote Sticky firmware
#
# v1.0.25 makes Find Remote continuously self-restarting while preserving the
# v1.0.24 buzzer, readiness, wake/touch, and sleep-availability behavior.

substitutions:
  device_name: basement-remote-sticky
  friendly_name: Basement Remote Sticky
  firmware_version: "1.0.25"

packages:
  sticky_v1014_base:
    url: https://github.com/CitizenRacer/BasementRemote
    ref: dc4113e58f1b3d96a08825d5e63aadbaac05603b
    files:
      - esphome/basement-remote-sticky.yaml
    refresh: 0s

  # Remove the inherited v1.0.14 on_boot automation so its early "ready" log
  # cannot fire before Wi-Fi/API/Home Assistant are actually usable. The local
  # on_boot block below recreates only the required hardware sequencing.
  remove_legacy_boot:
    esphome:
      on_boot: !remove

esphome:
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_42);
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 1);
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_hold_dis(GPIO_NUM_47);
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - switch.turn_on: touch_power_enable
        - delay: 100ms
        - component.update: epaper_display

  # The base shutdown runs first at its default priority. This later shutdown
  # action changes only GPIO42, retaining touch power through deep sleep while
  # leaving the board latch and e-paper rail untouched.
  on_shutdown:
    - priority: 700
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_42);
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 1);
            gpio_hold_en(GPIO_NUM_42);
            gpio_deep_sleep_hold_en();
            ESP_LOGI("touch", "GT911 power retained through deep sleep");

# The GT911 has a dedicated I2C bus. Avoid the extra startup scan.
i2c:
  - id: !extend touch_i2c
    scan: false

# GPIO48 is the reTerminal Sticky's built-in passive buzzer. LEDC provides the
# variable-frequency PWM required by the RTTTL tone generator.
output:
  - platform: ledc
    id: buzzer_pwm
    pin: GPIO48

rtttl:
  id: locator_rtttl
  output: buzzer_pwm

# Replace only the inherited AI / Power binary sensor so the held-time log uses
# a printf format that exactly matches the ESP32-S3 toolchain's argument type.
binary_sensor:
  - id: !remove button_ai_power

  - platform: gpio
    id: button_ai_power
    name: "AI Power Button"
    pin:
      number: GPIO4
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "AI / Power button pressed"
      - lambda: |-
          if (!id(woke_from_tv_off_sleep)) {
            id(ai_power_pressed_ms) = millis();
          }
          id(tv_wake_in_progress) = true;
    on_release:
      - lambda: |-
          const bool was_sleep_wake = id(woke_from_tv_off_sleep);
          id(woke_from_tv_off_sleep) = false;

          if (was_sleep_wake) {
            ESP_LOGD("power", "Ignoring release classification for deep-sleep wake press");
            return;
          }

          const uint32_t held_ms = millis() - id(ai_power_pressed_ms);
          if (held_ms >= 800) {
            ESP_LOGI("power", "AI / Power long press (%lu ms): TV off",
                     static_cast<unsigned long>(held_ms));
            id(turn_tv_off_after_power_button).execute();
          } else {
            ESP_LOGI("power", "AI / Power short press (%lu ms): TV on",
                     static_cast<unsigned long>(held_ms));
            id(wake_tv_after_power_button).execute();
          }

globals:
  - id: ready_logged
    type: bool
    restore_value: false
    initial_value: "false"

# Find Remote is intentionally a switch rather than a momentary button: turning
# it on starts the locator sound and turning it off stops it. ALWAYS_OFF prevents
# a reboot/wake from unexpectedly resuming the buzzer.
switch:
  - platform: template
    id: find_remote
    name: "Find Remote"
    icon: "mdi:map-marker-sound"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - logger.log: "Find Remote enabled"
      - rtttl.play: 'find:d=8,o=6,b=180:a,p,e7,p,a,p,e7,p'
    turn_off_action:
      - rtttl.stop:
      - logger.log: "Find Remote disabled"
      # If the TV is already off, return to the normal sleep path now that the
      # locator no longer needs the radio/CPU to remain awake.
      - if:
          condition:
            lambda: |-
              return id(basement_tv_state).has_state() &&
                     id(basement_tv_state).state == "off" &&
                     !id(tv_wake_in_progress);
          then:
            - script.execute: enter_tv_off_sleep

# Initialize after touch power restoration. 0x5D is the working GT911 address
# confirmed by the production Sticky boot log.
touchscreen:
  - id: !extend sticky_touch
    setup_priority: 500
    address: 0x5D

# Any API client can fire on_client_connected, including ESPHome Device Builder's
# live logger. Funnel those events through a mode: single script so only one
# readiness evaluation can be in flight at a time. Once ready_logged is true,
# later client connections are intentionally silent.
api:
  id: remote_api
  on_client_connected:
    - script.execute: report_ready_after_init

# Keep the v1.0.14 GPIO4 wake source and board-latch behavior. Add the slower HA
# recovery path for reconnects that take longer than the first wake automation.
deep_sleep:
  on_wake:
    - script.execute: wake_tv_after_reconnect

script:
  - id: report_ready_after_init
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(ready_logged);'
          then:
            - delay: 2s
            - if:
                condition:
                  api.connected:
                    state_subscription_only: true
                then:
                  # A connected API socket is not enough: wait until Home
                  # Assistant has delivered the imported TV state before
                  # declaring the remote ready.
                  - wait_until:
                      condition:
                        lambda: |-
                          return id(basement_tv_state).has_state() &&
                                 id(basement_tv_state).state != "unknown" &&
                                 id(basement_tv_state).state != "unavailable";
                      timeout: 15s
                  - if:
                      condition:
                        lambda: |-
                          return id(basement_tv_state).has_state() &&
                                 id(basement_tv_state).state != "unknown" &&
                                 id(basement_tv_state).state != "unavailable" &&
                                 !id(sticky_touch).is_failed() &&
                                 !id(epaper_display).is_failed();
                      then:
                        - logger.log: "Basement Remote firmware ${firmware_version} ready"
                        - lambda: 'id(ready_logged) = true;'
                      else:
                        - logger.log:
                            level: ERROR
                            format: "Basement Remote initialization incomplete; not reporting ready"

  # Awake short presses and deep-sleep wake both use the same authoritative
  # Home Assistant TV-on script used by Alexa.
  - id: !remove wake_tv_after_power_button

  - id: wake_tv_after_power_button
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "AI / Power wake: waiting for Home Assistant"
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 60s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - delay: 2s
            - logger.log: "AI / Power wake: calling shared Home Assistant TV-on script"
            - homeassistant.action:
                action: script.tv_turn_on_the_tv_cable
          else:
            - logger.log:
                level: ERROR
                format: "AI / Power wake: Home Assistant did not become ready"
      - delay: 30s
      - lambda: 'id(tv_wake_in_progress) = false;'
      - if:
          condition:
            lambda: |-
              return id(basement_tv_state).has_state() &&
                     id(basement_tv_state).state == "off";
          then:
            - script.execute: enter_tv_off_sleep

  # Replace the inherited sleep decision so an active Find Remote session keeps
  # the Sticky awake and audible even if the TV is off. Turning Find Remote off
  # schedules this sleep path again when appropriate.
  - id: !remove enter_tv_off_sleep

  - id: enter_tv_off_sleep
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            and:
              - switch.is_off: find_remote
              - lambda: |-
                  return id(basement_tv_state).has_state() &&
                         id(basement_tv_state).state == "off" &&
                         !id(tv_wake_in_progress);
          then:
            - logger.log: "Basement TV is off; entering remote deep sleep"
            - script.execute: render_sleep_and_enter

  # Replace the inherited sleep-entry script. Wi-Fi is deliberately disabled
  # before deep_sleep.enter so Home Assistant sees an unexpected disconnect and
  # marks state-bearing ESPHome entities unavailable instead of retaining stale
  # values for an expected deep-sleep disconnect.
  - id: !remove render_sleep_and_enter

  - id: render_sleep_and_enter
    mode: restart
    then:
      - logger.log: "Rendering approved sleep face"
      - lambda: 'id(sleep_display_active) = true;'
      - component.update: epaper_display
      - delay: 10s
      - logger.log: "Sleep face rendered; dropping Wi-Fi before deep sleep"
      - wifi.disable:
      - delay: 2s
      - deep_sleep.enter: tv_power_sleep

  - id: wake_tv_after_reconnect
    mode: restart
    then:
      - lambda: 'id(tv_wake_in_progress) = true;'
      - logger.log: "Deep-sleep recovery: waiting for Home Assistant subscription"
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 60s
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - delay: 2s
            - logger.log: "Deep-sleep recovery: calling shared Home Assistant TV-on script"
            - homeassistant.action:
                action: script.tv_turn_on_the_tv_cable
            - repeat:
                count: 8
                then:
                  - delay: 5s
                  - lambda: 'id(tv_wake_in_progress) = true;'
            - lambda: 'id(tv_wake_in_progress) = false;'
            - script.execute: enter_tv_off_sleep
          else:
            - logger.log:
                level: ERROR
                format: "Deep-sleep recovery: Home Assistant did not become ready within 60 seconds"
            - lambda: 'id(tv_wake_in_progress) = false;'

# Any local interaction dismisses Find Remote without consuming the user's
# actual remote command. The inherited touch handler exposes touch_active, and
# all three physical buttons are already binary sensors. A separate 250 ms
# watchdog guarantees the locator restarts whenever RTTTL has gone idle.
interval:
  - interval: 25ms
    then:
      - if:
          condition:
            and:
              - switch.is_on: find_remote
              - or:
                  - binary_sensor.is_on: button_ai_power
                  - binary_sensor.is_on: button_up
                  - binary_sensor.is_on: button_down
                  - lambda: 'return id(touch_active);'
          then:
            - logger.log: "Find Remote cancelled by local input"
            - switch.turn_off: find_remote

  - interval: 250ms
    then:
      - if:
          condition:
            lambda: 'return id(find_remote).state && !id(locator_rtttl).is_playing();'
          then:
            - rtttl.play: 'find:d=8,o=6,b=180:a,p,e7,p,a,p,e7,p'
