name: Apply streaming launcher UI update

on:
  push:
    branches:
      - ui-streaming-launchers

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui-streaming-launchers

      - name: Apply update
        run: python tools/apply_streaming_launcher_update.py

      - name: Commit generated firmware change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esphome/basement-remote-sticky.yaml
          git commit -m "Firmware v0.2.10: streaming launcher UI"
          git push origin HEAD:ui-streaming-launchers
