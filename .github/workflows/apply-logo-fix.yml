name: Apply launcher logo fix

on:
  push:
    branches:
      - logo-render-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: logo-render-fix
      - name: Patch firmware
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('esphome/basement-remote-sticky.yaml')
          s = p.read_text()
          s = s.replace('firmware_version: "0.2.10"', 'firmware_version: "0.2.11"')
          s = s.replace('https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg', 'https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/disney-d.svg')
          s = s.replace('resize: 82x44', 'resize: 66x52', 1)
          s = s.replace('https://upload.wikimedia.org/wikipedia/commons/4/4e/Paramount%2B_logo.svg', 'https://raw.githubusercontent.com/CitizenRacer/BasementRemote/main/assets/paramount-plus-mark.svg')
          s = s.replace('resize: 92x28', 'resize: 86x56', 1)
          p.write_text(s)
          PY
      - name: Commit firmware and remove temporary workflow
        run: |
          rm .github/workflows/apply-logo-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add esphome/basement-remote-sticky.yaml .github/workflows/apply-logo-fix.yml
          git commit -m 'Firmware v0.2.11: fix Disney and Paramount launcher artwork'
          git push origin logo-render-fix
