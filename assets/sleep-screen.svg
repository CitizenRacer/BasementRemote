<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800">
  <rect width="480" height="800" fill="#fff"/>

  <!-- Sleep mark -->
  <circle cx="185" cy="337" r="81" fill="#000"/>
  <circle cx="219" cy="305" r="72" fill="#fff"/>
  <path d="M233 315h25l-25 30h25" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M269 278h31l-31 36h31" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M311 233h39l-39 46h39" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="240" y="483" text-anchor="middle" fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400">Sleeping</text>
  <!-- Heavier/larger than the previous version so the 1-bit e-paper rasterizer cannot lose the wake instruction. -->
  <text x="240" y="708" text-anchor="middle" fill="#000" stroke="#000" stroke-width="0.7" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Press power to wake</text>

  <!-- Whimsical arrow: intentionally irregular loops. The shaft joins the rear leg of the arrowhead instead of running into the tip. -->
  <path d="M292 681
           C344 655 385 608 404 552
           C414 522 414 496 406 477
           C398 458 378 454 365 469
           C351 486 358 515 379 523
           C397 530 412 516 417 492
           C423 464 417 430 410 405
           C404 382 389 370 375 379
           C360 389 361 416 378 428
           C396 440 416 427 421 399
           C430 351 416 287 420 239
           C424 193 438 151 452 134"
        fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M438 120 L461 108 L452 134"
        fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
